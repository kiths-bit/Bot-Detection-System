<!DOCTYPE html>
<html>
<head>

<title>Bot Detection Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-gray-900 text-white">

<div class="p-10">

<h1 class="text-3xl font-bold mb-8">🛡 Bot Detection Dashboard</h1>

<div class="grid grid-cols-3 gap-6">

<div class="bg-gray-800 p-6 rounded-xl">

<h2 class="text-lg mb-2">Status</h2>

{% if status == "Human" %}
<p class="text-green-400 text-xl">Human</p>
{% else %}
<p class="text-red-400 text-xl">Bot Detected</p>
{% endif %}

</div>

<div class="bg-gray-800 p-6 rounded-xl">

<h2>Bot Score</h2>

<div class="w-full bg-gray-700 rounded-full h-4 mt-3">
<div class="bg-red-500 h-4 rounded-full" style="width: {{bot_score*50}}%"></div>
</div>

</div>

<div class="bg-gray-800 p-6 rounded-xl">

<h2>IP Address</h2>
<p>{{ip}}</p>

</div>

</div>

<div class="mt-10 bg-gray-800 p-6 rounded-xl">

<h2 class="mb-4">Traffic Monitor</h2>

<canvas id="chart"></canvas>

</div>

<div class="mt-10 bg-gray-800 p-6 rounded-xl">

<h2 class="mb-4">Recent Requests</h2>

<table class="w-full">

<tr class="text-left">
<th>IP</th>
<th>Status</th>
<th>User Agent</th>
</tr>

{% for item in log %}

<tr>

<td>{{item.ip}}</td>
<td>{{item.status}}</td>
<td>{{item.agent}}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

<script>

const ctx=document.getElementById("chart")

new Chart(ctx,{
type:"line",
data:{
labels:["1","2","3","4","5"],
datasets:[{
label:"Requests",
data:[1,3,2,5,4]
}]
}
})

</script>

</body>
</html>
